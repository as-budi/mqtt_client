# Rujukan tahap M4. Konfigurasi lengkap (sudah memuat bagian ini) ada di mqtt-client.conf (tahap M7).

# Relay WebSocket -> TCP (tahap M4): wss://mqtt.<domain>/relay/<tiket> -> 127.0.0.1:8003
# Di awal file, di luar blok server:
#   limit_conn_zone $binary_remote_addr zone=mqttc_relay:10m;
location /relay/ {
    limit_conn mqttc_relay 10;
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Endpoint Django khusus relay di server yang sama: TIDAK boleh dibuka dari internet.
location /internal/ {
    return 404;
}
