# TAHAP AWAL (sebelum ada sertifikat HTTPS) untuk mqtt.reslab-csub.cloud.
# Hanya untuk mengambil sertifikat Let's Encrypt. Aplikasi BELUM dibuka lewat http://:
# login memakai akun IoT Platform, jadi tidak boleh lewat jaringan tanpa enkripsi.
# Setelah sertifikat terbit, ganti berkas ini dengan mqtt-client.conf (docs/deploy.md).
#
# Server default (menolak host tak dikenal) sudah ada di konfigurasi IoT Platform;
# berkas ini TIDAK memakai default_server.

server {
    listen 80;
    listen [::]:80;
    server_name mqtt.reslab-csub.cloud;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "MQTT Client: HTTPS is not set up yet.\n";
        default_type text/plain;
    }
}
