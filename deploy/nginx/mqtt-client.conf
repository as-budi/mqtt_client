# Konfigurasi AKHIR MQTT Client (setelah sertifikat Let's Encrypt terbit), tahap M7.
# Satu VPS dengan IoT Platform: berkas ini DITAMBAHKAN di samping iot-platform.conf.
#
#   http://mqtt.reslab-csub.cloud   -> https:// (kecuali validasi certbot)
#   https://mqtt.reslab-csub.cloud  -> Gunicorn 127.0.0.1:8002 (mqttc-web)
#   wss://mqtt.reslab-csub.cloud/relay/<tiket> -> relay 127.0.0.1:8003 (mqttc-relay)
#   /internal/                      -> 404 (hanya untuk relay, langsung di 127.0.0.1)

upstream mqttc_web {
    server 127.0.0.1:8002;
}

# Nama zona memakai awalan mqttc_ supaya tidak bentrok dengan zona iot_ milik platform.
# Login: 10 per menit per IP. Halaman lain: 10 per detik per IP.
limit_req_zone $binary_remote_addr zone=mqttc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mqttc_web:10m rate=10r/s;
# Koneksi relay yang terbuka bersamaan per IP.
limit_conn_zone $binary_remote_addr zone=mqttc_relay:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mqtt.reslab-csub.cloud;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mqtt.reslab-csub.cloud;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mqtt.reslab-csub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.reslab-csub.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_MQTTC:10m;
    ssl_session_timeout 1d;

    # Header keamanan. (HSTS dikirim oleh Django, lihat DJANGO_HSTS_SECONDS.)
    # CSP: skrip hanya dari server ini dan jsDelivr (Bootstrap); koneksi WebSocket hanya
    # wss:// (broker pilihan pengguna, relay); form boleh berakhir di IoT Platform (logout).
    # worker-src blob: dibutuhkan mqtt.js (timer keepalive di Web Worker).
    set $mqttc_csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://iot.reslab-csub.cloud";
    add_header Content-Security-Policy $mqttc_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 256k;

    # File statis (collectstatic). Tanpa hash di nama, jadi disimpan sebentar saja.
    location /static/ {
        alias /srv/mqttc/app/staticfiles/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $mqttc_csp always;
    }

    # Endpoint khusus relay: TIDAK boleh dibuka dari internet.
    location /internal/ {
        return 404;
    }

    # Relay WebSocket -> TCP (tahap M4).
    location /relay/ {
        limit_conn mqttc_relay 10;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/(login|oidc/callback|admin/login)/$ {
        limit_req zone=mqttc_login burst=5 nodelay;
        proxy_pass http://mqttc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mqttc_web burst=40 nodelay;
        proxy_pass http://mqttc_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
