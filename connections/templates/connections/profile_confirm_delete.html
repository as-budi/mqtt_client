{% extends "base.html" %}

{% block title %}Delete {{ profile.name }} · MQTT Client{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card"><div class="card-body p-4">
      <h1 class="h4">Delete "{{ profile.name }}"?</h1>
      <p class="text-muted">The connection settings and its saved subscriptions are removed.
        Nothing changes on the broker.</p>
      <form method="post" class="d-flex gap-2">{% csrf_token %}
        <a class="btn btn-outline-secondary flex-fill" href="{% url 'connections:list' %}">Cancel</a>
        <button type="submit" class="btn btn-danger flex-fill">Delete</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
